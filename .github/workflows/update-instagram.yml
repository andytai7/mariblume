name: New Instagram products

on:
  workflow_dispatch: # manual run: Actions tab → "New Instagram products" → Run workflow
  schedule:
    - cron: "23 7 * * 1" # weekly, Mondays 07:23 UTC

permissions:
  contents: write # required to commit new products

concurrency:
  group: instagram-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (thumbnails, black-bar cropping)
        run: pip install pillow
      - name: Scrape Instagram and add new products
        run: python3 tools/update_instagram.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
      - name: Commit changes
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes — no new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/products instagram-state.json
          git commit -m "Add new Instagram products ($(date -u +%Y-%m-%d))"
          git push
